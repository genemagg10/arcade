<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040712"/>
      <stop offset="100%" stop-color="#0c1428"/>
    </linearGradient>
    <linearGradient id="ceil" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2a3c5e"/>
      <stop offset="100%" stop-color="#10182c"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#101828"/>
      <stop offset="100%" stop-color="#31466c"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#101828"/>
      <stop offset="100%" stop-color="#31466c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24344f"/>
      <stop offset="100%" stop-color="#0a101c"/>
    </linearGradient>
    <radialGradient id="hatch" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f4fbff"/>
      <stop offset="28%" stop-color="#7ec8ff"/>
      <stop offset="62%" stop-color="#1a4f9a"/>
      <stop offset="100%" stop-color="#071226"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6eb6ff" stop-opacity="0.15"/>
      <stop offset="42%" stop-color="#d7eeff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#d7eeff"/>
      <stop offset="100%" stop-color="#4a9bff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-120%" y="-30%" width="340%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="winL">
      <polygon points="34,104 86,116 86,158 34,164"/>
    </clipPath>
    <clipPath id="winR">
      <polygon points="366,104 314,116 314,158 366,164"/>
    </clipPath>
  </defs>

  <rect width="400" height="300" fill="url(#void)"/>

  <!-- distant stars beyond the trench -->
  <g fill="#d7e7ff">
    <circle cx="18" cy="8" r="1.1" opacity="0.8"/>
    <circle cx="46" cy="14" r="0.7" opacity="0.55"/>
    <circle cx="92" cy="6" r="1" opacity="0.7"/>
    <circle cx="310" cy="10" r="0.8" opacity="0.6"/>
    <circle cx="348" cy="5" r="1.2" opacity="0.75"/>
    <circle cx="378" cy="16" r="0.7" opacity="0.5"/>
  </g>

  <!-- ceiling -->
  <polygon points="0,16 400,16 250,104 150,104" fill="url(#ceil)"/>
  <!-- walls -->
  <polygon points="0,16 150,104 150,186 0,292" fill="url(#wallL)"/>
  <polygon points="400,16 250,104 250,186 400,292" fill="url(#wallR)"/>
  <!-- floor -->
  <polygon points="0,292 150,186 250,186 400,292" fill="url(#floor)"/>

  <!-- wall panel seams, left -->
  <g fill="none" stroke="#0c1424" stroke-width="2" opacity="0.55">
    <polyline points="0,66 150,119"/>
    <polyline points="0,122 150,137"/>
    <polyline points="0,178 150,155"/>
    <polyline points="0,234 150,172"/>
    <polyline points="38,28 38,275"/>
    <polyline points="75,49 75,241"/>
    <polyline points="112,70 112,208"/>
  </g>
  <!-- wall panel seams, right -->
  <g fill="none" stroke="#0c1424" stroke-width="2" opacity="0.55">
    <polyline points="400,66 250,119"/>
    <polyline points="400,122 250,137"/>
    <polyline points="400,178 250,155"/>
    <polyline points="400,234 250,172"/>
    <polyline points="362,28 362,275"/>
    <polyline points="325,49 325,241"/>
    <polyline points="288,70 288,208"/>
  </g>

  <!-- viewport windows -->
  <polygon points="34,104 86,116 86,158 34,164" fill="#070d1c"/>
  <polygon points="366,104 314,116 314,158 366,164" fill="#070d1c"/>
  <g clip-path="url(#winL)" fill="#cfe4ff">
    <circle cx="46" cy="122" r="1"/>
    <circle cx="62" cy="136" r="0.7" opacity="0.7"/>
    <circle cx="52" cy="150" r="1.1"/>
    <circle cx="74" cy="126" r="0.6" opacity="0.6"/>
  </g>
  <g clip-path="url(#winR)" fill="#cfe4ff">
    <circle cx="354" cy="122" r="1"/>
    <circle cx="338" cy="136" r="0.7" opacity="0.7"/>
    <circle cx="348" cy="150" r="1.1"/>
    <circle cx="326" cy="126" r="0.6" opacity="0.6"/>
  </g>
  <polygon points="34,104 86,116 86,158 34,164" fill="none" stroke="#6eb6ff" stroke-width="1.5" opacity="0.7"/>
  <polygon points="366,104 314,116 314,158 366,164" fill="none" stroke="#6eb6ff" stroke-width="1.5" opacity="0.7"/>

  <!-- small panel lamps -->
  <g>
    <rect x="14" y="86" width="10" height="4" rx="1" fill="#7ec8ff" opacity="0.85"/>
    <rect x="48" y="98" width="8" height="3" rx="1" fill="#7ec8ff" opacity="0.6"/>
    <rect x="90" y="128" width="8" height="3" rx="1" fill="#9ad4ff" opacity="0.7"/>
    <rect x="376" y="86" width="10" height="4" rx="1" fill="#7ec8ff" opacity="0.85"/>
    <rect x="344" y="98" width="8" height="3" rx="1" fill="#7ec8ff" opacity="0.6"/>
    <rect x="302" y="128" width="8" height="3" rx="1" fill="#9ad4ff" opacity="0.7"/>
  </g>

  <!-- ceiling light strip -->
  <polygon points="168,24 232,24 216,96 184,96" fill="#4aa4ff" opacity="0.28"/>
  <polygon points="186,32 214,32 206,92 194,92" fill="#eaf6ff" opacity="0.85"/>
  <polygon points="194,36 206,36 202,88 198,88" fill="#ffffff"/>

  <!-- floor trench lines -->
  <g stroke="#8fb4de" stroke-width="1.25" opacity="0.28" fill="none">
    <line x1="80" y1="292" x2="170" y2="186"/>
    <line x1="140" y1="292" x2="185" y2="186"/>
    <line x1="200" y1="292" x2="200" y2="186"/>
    <line x1="260" y1="292" x2="215" y2="186"/>
    <line x1="320" y1="292" x2="230" y2="186"/>
  </g>
  <polygon points="176,292 194,210 206,210 224,292" fill="#07101e" opacity="0.45"/>

  <!-- far airlock -->
  <rect x="150" y="104" width="100" height="82" fill="#0a1220"/>
  <circle cx="200" cy="145" r="30" fill="#06101e"/>
  <circle cx="200" cy="145" r="26" fill="none" stroke="#3d6eaa" stroke-width="3"/>
  <circle cx="200" cy="145" r="18" fill="none" stroke="#7eb8ee" stroke-width="2" opacity="0.8"/>
  <circle cx="200" cy="145" r="11" fill="url(#hatch)"/>
  <circle cx="200" cy="145" r="4" fill="#f7fcff"/>

  <!-- saber bloom -->
  <ellipse cx="214" cy="148" rx="16" ry="62" fill="#3d8cff" opacity="0.45" filter="url(#bloom)"/>

  <!-- adventurer, original hooded figure -->
  <path d="M142,214 C150,188 164,180 176,186 C188,176 198,190 204,204 L196,246 L150,250 Z" fill="#1a2742"/>
  <path d="M150,214 C158,196 170,190 178,196 L172,236 L152,240 Z" fill="#243656"/>
  <ellipse cx="168" cy="184" rx="13" ry="15" fill="#243656"/>
  <ellipse cx="168" cy="186" rx="8" ry="9" fill="#0c1424"/>
  <rect x="161" y="184" width="14" height="3" rx="1.2" fill="#9ad7ff"/>
  <path d="M186,198 C194,206 202,208 208,206" stroke="#2a3c5a" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- blue energy blade -->
  <g filter="url(#glow)">
    <rect x="207" y="78" width="12" height="124" rx="6" fill="url(#blade)"/>
  </g>
  <rect x="211" y="84" width="4" height="112" rx="2" fill="#ffffff"/>

  <!-- hilt -->
  <rect x="202" y="198" width="22" height="7" rx="2" fill="#d5deea"/>
  <rect x="205" y="205" width="16" height="18" rx="2" fill="#8d98ab"/>
  <rect x="208" y="211" width="10" height="4" rx="1" fill="#4aa8ff"/>
  <rect x="203" y="223" width="20" height="6" rx="2" fill="#e4ebf5"/>

  <!-- title plate -->
  <rect x="0" y="252" width="400" height="48" fill="#050914" opacity="0.72"/>
  <rect x="36" y="256" width="328" height="1.5" fill="#7ec8ff" opacity="0.7"/>
  <g font-family="ui-monospace,'Courier New',monospace" font-weight="700" text-anchor="middle">
    <text x="200" y="274" font-size="13" letter-spacing="5" fill="#1a4f9a">STAR WARS</text>
    <text x="200" y="272" font-size="13" letter-spacing="5" fill="#b9e4ff">STAR WARS</text>
    <text x="201" y="294" font-size="20" letter-spacing="2" fill="#12386e">ADVENTURE</text>
    <text x="200" y="292" font-size="20" letter-spacing="2" fill="#f4fbff">ADVENTURE</text>
  </g>
</svg>
